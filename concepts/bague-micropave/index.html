<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private preview</title>
<style>
:root{--bg:#ffffff;--ink:#1d1d22;--muted:#6c6c76}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--ink:#ededf0;--muted:#8d8d96}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;box-sizing:border-box}
h1{font-family:"Didot","Bodoni 72",Georgia,serif;font-weight:400;font-size:clamp(26px,5vw,40px);margin:0 0 12px}
p{color:var(--muted);font-size:15px;margin:0}
</style>
</head>
<body><main><h1>This private preview is no longer available.</h1><p>Weskale Studio</p></main></body>
</html>
